<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Live Sync & Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBYfbe7TqTc9geIWjUeNTsxeXXytaHoMk",
            authDomain: "pabapp-d9067.firebaseapp.com",
            databaseURL: "https://pabapp-d9067-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pabapp-d9067",
            storageBucket: "pabapp-d9067.firebasestorage.app",
            messagingSenderId: "311970041106",
            appId: "1:311970041106:web:c6be2a818ff4a0eb7277cb",
            measurementId: "G-GKGSX0YSNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'planning');

        window.allSchedules = {};
        window.currentWeekKey = "";

        window.getWeekKey = function(d) {
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            const num = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
            return `${date.getFullYear()}-W${String(num).padStart(2, '0')}`;
        };

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.allSchedules = data;
                if (!window.currentWeekKey) {
                    window.currentWeekKey = getWeekKey(new Date());
                    document.getElementById('weekSelector').value = window.currentWeekKey;
                    updateDateLabels();
                }
                renderPlanning();
            } else {
                window.allSchedules = {};
                saveMasterData(true); 
            }
        });

        window.saveMasterData = function(isInit = false) {
            if(isInit && (!window.allSchedules || Object.keys(window.allSchedules).length === 0)) {
                const now = new Date();
                const weekKey = getWeekKey(now);
                window.allSchedules[weekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.currentWeekKey = weekKey;
            }
            set(dbRef, window.allSchedules);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; color: #1a1a1a; }
        table { table-layout: fixed; width: 100%; }
        select { appearance: none; outline: none; border: none; background: transparent; width: 100%; text-align-last: center; cursor: pointer; }
        .shift-cell { width: 85px; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #4A6762; color: #ffffff; } 
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; color: #94a3b8; }
        .row-alert { background-color: rgba(254, 202, 202, 0.6) !important; border-left: 6px solid #dc2626; }
        
        @media print {
            nav, .no-print { display: none !important; }
            body { background: white; }
            main { padding: 0 !important; max-width: 100% !important; }
            .bg-white { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-2xl font-semibold tracking-tighter text-gray-900">Pab<span class="text-indigo-600">app</span></h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1 gap-1">
                    <button onclick="changeWeek(-1)" class="p-2 hover:text-indigo-500 text-xs">◀</button>
                    <input type="week" id="weekSelector" onchange="loadWeekData()" class="bg-transparent text-xs font-medium text-gray-600 outline-none">
                    <button onclick="changeWeek(1)" class="p-2 hover:text-indigo-500 text-xs">▶</button>
                </div>
                <span id="navMonthDisplay" class="text-sm font-medium text-indigo-500 bg-indigo-50 px-4 py-1.5 rounded-full uppercase tracking-wider text-[10px]"></span>
            </div>
        </div>

        <div class="flex items-center gap-3 no-print">
            <button onclick="exportCSV()" class="p-2 text-gray-400 hover:text-indigo-600 title="Exporter Excel">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>
            <button onclick="window.print()" class="p-2 text-gray-400 hover:text-indigo-600" title="Imprimer PDF">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            </button>
            <button onclick="toggleView('billing')" class="text-gray-500 hover:text-indigo-500 text-sm font-medium px-2">Bilan</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm hover:bg-black transition-all">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-8 max-w-[1600px] mx-auto">
        <div class="mb-6 text-xl font-light text-gray-400 italic" id="tableMonthHeader"></div>
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="text-sm text-left border-collapse" id="mainTable">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="p-6 font-medium text-gray-400 uppercase text-[10px] w-40 border-r tracking-widest">Team</th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Lun</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Mar</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Mer</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Jeu</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Ven</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Sam</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase mb-1">Dim</span><span class="day-date text-gray-900 text-lg font-semibold"></span></th>
                        <th class="p-4 text-center font-bold text-indigo-500 bg-indigo-50/30 w-28 text-[10px] uppercase tracking-widest">Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot><tr id="totalDailyRow" class="bg-gray-50/30 border-t border-gray-100"></tr></tfoot>
            </table>
        </div>
    </main>

    <main id="billingView" class="hidden p-8 max-w-4xl mx-auto">
        <button onclick="toggleView('planning')" class="text-indigo-500 text-sm font-medium mb-6 flex items-center gap-2">← Retour</button>
        <h2 class="text-4xl font-semibold text-gray-900 mb-8 tracking-tighter">Bilan Mensuel</h2>
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50"><tr class="border-b border-gray-100"><th class="p-6 font-medium text-gray-500 uppercase text-[10px]">Employé</th><th class="p-6 font-medium text-gray-500 text-center uppercase text-[10px]">Heures/Mois</th><th class="p-6 font-medium text-gray-500 text-center uppercase text-[10px]">Coût (12€/h)</th></tr></thead>
                <tbody id="billingBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SHIFT_HOURS = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        const BASE_TEMPLATE = [
            {name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},
            {name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},
            {name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},
            {name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},
            {name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]},
            {name:"Maria",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Snow",schedule:["C","C","C","Off","Off","C","X"]},
            {name:"Selah",schedule:["","C","","C","","",""]},
            {name:"Andrew",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Valentine",schedule:["C","C","C","","","","C"]},
            {name:"Solal",schedule:["Off","C","C","C","C","X","Off"]},
            {name:"Artem",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Celine",schedule:["Off","Off","C","C","C","C","X"]}
        ];

        function getNetHours(code) { 
            let brute = SHIFT_HOURS[code] || 0; 
            return brute > 6 ? brute - 0.5 : brute; 
        }

        function isScheduleInvalid(schedule) {
            const counts = { 'C': 0, 'X': 0, 'Off': 0 };
            schedule.forEach(s => { if(counts[s] !== undefined) counts[s]++; });
            return (counts['C'] !== 4 || counts['X'] !== 1 || counts['Off'] !== 2);
        }

        function loadWeekData() {
            window.currentWeekKey = document.getElementById('weekSelector').value;
            if (!window.allSchedules[window.currentWeekKey]) {
                window.allSchedules[window.currentWeekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.saveMasterData();
            }
            updateDateLabels();
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            if(!tbody || !window.allSchedules[window.currentWeekKey]) return;
            tbody.innerHTML = "";
            let dailyTotals = [0,0,0,0,0,0,0];
            
            window.allSchedules[window.currentWeekKey].forEach((emp, empIdx) => {
                const invalid = isScheduleInvalid(emp.schedule);
                let row = document.createElement('tr');
                row.className = `border-b border-gray-50 hover:bg-gray-50 transition-colors ${invalid ? 'row-alert' : ''}`;
                
                let weeklyTotal = 0;
                let html = `<td class="p-5 font-medium text-gray-700 border-r text-xs uppercase tracking-tight"><span class="cursor-pointer" onclick="editName(${empIdx})">${emp.name}</span></td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    const net = getNetHours(code);
                    weeklyTotal += net;
                    dailyTotals[dayIdx] += net;
                    html += `<td class="p-2.5 text-center border-r border-gray-50">
                        <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" class="w-full rounded-xl py-2.5 text-center font-bold text-[11px] ${code ? 'shift-'+code : 'shift-Empty'} shadow-sm">
                            ${Object.keys(SHIFT_HOURS).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                        </select></td>`;
                });
                html += `<td class="p-5 text-center font-bold text-indigo-600 bg-indigo-50/20">${weeklyTotal}h</td>`;
                row.innerHTML = html;
                tbody.appendChild(row);
            });
            renderDailyTotals(dailyTotals);
        }

        function updateShift(empIdx, dayIdx, value) {
            window.allSchedules[window.currentWeekKey][empIdx].schedule[dayIdx] = value;
            window.saveMasterData();
        }

        function editName(index) {
            const n = prompt("Nom :", window.allSchedules[window.currentWeekKey][index].name);
            if(n) {
                window.allSchedules[window.currentWeekKey][index].name = n;
                window.saveMasterData();
            }
        }

        function addNewEmployee() {
            const n = prompt("Nom :");
            if(n) {
                if(!window.allSchedules[window.currentWeekKey]) window.allSchedules[window.currentWeekKey] = [];
                window.allSchedules[window.currentWeekKey].push({name: n, schedule: ["","","","","","",""]});
                window.saveMasterData();
            }
        }

        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            let html = `<td class="p-5 border-r text-gray-400 text-[9px] font-bold uppercase italic tracking-widest">Total Jour</td>`;
            totals.forEach(t => { html += `<td class="p-4 text-center text-gray-900 font-bold text-base">${t}h</td>`; });
            html += `<td class="bg-indigo-50/30"></td>`;
            footerRow.innerHTML = html;
        }

        function updateDateLabels() {
            const [year, week] = window.currentWeekKey.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));
            const monthText = monday.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
            document.getElementById('navMonthDisplay').innerText = monthText;
            document.getElementById('tableMonthHeader').innerText = "Planning de " + monthText;
            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                label.innerText = d.getDate();
            });
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            loadWeekData();
        }

        function toggleView(view) {
            document.getElementById('planningView').classList.toggle('hidden', view === 'billing');
            document.getElementById('billingView').classList.toggle('hidden', view === 'planning');
            if(view === 'billing') {
                const tbody = document.getElementById('billingBody');
                tbody.innerHTML = "";
                window.allSchedules[window.currentWeekKey].forEach(emp => {
                    let h = emp.schedule.reduce((acc, c) => acc + getNetHours(c), 0);
                    let mH = (h * 4.33).toFixed(1);
                    tbody.innerHTML += `<tr class="border-b border-gray-100"><td class="p-6 font-semibold text-gray-700 uppercase text-xs">${emp.name}</td><td class="p-6 text-center text-gray-600 font-medium">${mH}h</td><td class="p-6 text-center font-bold text-green-600">${(mH * 12).toFixed(2)}€</td></tr>`;
                });
            }
        }

        function exportCSV() {
            let csv = "Employé,Lun,Mar,Mer,Jeu,Ven,Sam,Dim,Total\n";
            window.allSchedules[window.currentWeekKey].forEach(emp => {
                let total = emp.schedule.reduce((acc, c) => acc + getNetHours(c), 0);
                csv += `${emp.name},${emp.schedule.join(',')},${total}h\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Planning_${window.currentWeekKey}.csv`;
            link.click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const initialWeek = window.getWeekKey(now);
            window.currentWeekKey = initialWeek;
            document.getElementById('weekSelector').value = initialWeek;
            updateDateLabels();
        });
    </script>
</body>
</html>
