<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Export Mensuel Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBYfbe7TqTc9geIWjUeNTsxeXXytaHoMk",
            authDomain: "pabapp-d9067.firebaseapp.com",
            databaseURL: "https://pabapp-d9067-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pabapp-d9067",
            storageBucket: "pabapp-d9067.firebasestorage.app",
            messagingSenderId: "311970041106",
            appId: "1:311970041106:web:c6be2a818ff4a0eb7277cb",
            measurementId: "G-GKGSX0YSNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'planning');

        window.allSchedules = {};
        window.currentWeekKey = "";

        window.getWeekKey = function(d) {
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            const num = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
            return `${date.getFullYear()}-W${String(num).padStart(2, '0')}`;
        };

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.allSchedules = data;
                if (!window.currentWeekKey) {
                    window.currentWeekKey = getWeekKey(new Date());
                    document.getElementById('weekSelector').value = window.currentWeekKey;
                    updateDateLabels();
                }
                renderPlanning();
            } else {
                window.allSchedules = {};
                saveMasterData(true); 
            }
        });

        window.saveMasterData = function(isInit = false) {
            if(isInit && (!window.allSchedules || Object.keys(window.allSchedules).length === 0)) {
                const now = new Date();
                const weekKey = getWeekKey(now);
                window.allSchedules[weekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.currentWeekKey = weekKey;
            }
            set(dbRef, window.allSchedules);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; color: #1a1a1a; }
        table { table-layout: fixed; width: 100%; border-spacing: 0; border-collapse: collapse; }
        select { appearance: none; outline: none; border: none; background: transparent; width: 100%; text-align-last: center; cursor: pointer; }
        
        .shift-cell { width: 65px; border: 0.5px solid #e2e8f0; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #4A6762; color: #ffffff; } 
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #cbd5e1; color: #94a3b8; }
        
        .row-alert { background-color: rgba(254, 202, 202, 0.4) !important; border-left: 4px solid #dc2626; }

        /* Style Compact "Sheet" */
        .compact-td { padding: 4px 2px !important; font-size: 11px !important; height: 32px; }
        .compact-th { padding: 6px 2px !important; font-size: 10px !important; background-color: #f8fafc; }

        @media print {
            nav, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            main { padding: 10px !important; max-width: 100% !important; }
            .bg-white { border: none !important; box-shadow: none !important; }
            .week-container { page-break-inside: avoid; margin-bottom: 20px; }
            .day-date { font-size: 12px !important; }
        }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-4 flex justify-between items-center sticky top-0 z-50 no-print">
        <div class="flex items-center gap-8">
            <h1 class="text-xl font-bold tracking-tighter">Pab<span class="text-indigo-600">app</span></h1>
            <div class="flex items-center bg-gray-50 border rounded-full px-2 py-1 gap-1">
                <button onclick="changeWeek(-1)" class="p-1.5 hover:text-indigo-500 text-xs">◀</button>
                <input type="week" id="weekSelector" onchange="loadWeekData()" class="bg-transparent text-xs font-semibold outline-none">
                <button onclick="changeWeek(1)" class="p-1.5 hover:text-indigo-500 text-xs">▶</button>
            </div>
            <span id="navMonthDisplay" class="text-xs font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full uppercase"></span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="prepareMonthlyExport()" class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700 transition-all">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Exporter le Mois
            </button>
            <button onclick="toggleView('billing')" class="text-gray-500 hover:text-indigo-600 text-xs font-bold px-3">Bilan</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-4 py-2 rounded-full text-xs hover:bg-black transition-all">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-6 max-w-[1600px] mx-auto">
        <div id="exportContainer">
            <!-- Les semaines seront injectées ici -->
        </div>
    </main>

    <main id="billingView" class="hidden p-8 max-w-3xl mx-auto">
        <button onclick="toggleView('planning')" class="text-indigo-500 text-sm font-medium mb-4">← Retour</button>
        <h2 class="text-2xl font-bold mb-6">Bilan Mensuel</h2>
        <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b"><tr class="text-[10px] uppercase text-gray-500"><th class="p-4 text-left">Employé</th><th class="p-4 text-center">Heures estimées</th><th class="p-4 text-right">Coût total</th></tr></thead>
                <tbody id="billingBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SHIFT_HOURS = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        const BASE_TEMPLATE = [
            {name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},
            {name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},
            {name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},
            {name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},
            {name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]},
            {name:"Maria",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Snow",schedule:["C","C","C","Off","Off","C","X"]},
            {name:"Selah",schedule:["","C","","C","","",""]},
            {name:"Andrew",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Valentine",schedule:["C","C","C","","","","C"]},
            {name:"Solal",schedule:["Off","C","C","C","C","X","Off"]},
            {name:"Artem",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Celine",schedule:["Off","Off","C","C","C","C","X"]}
        ];

        function getNetHours(code) { 
            let brute = SHIFT_HOURS[code] || 0; 
            return brute > 6 ? brute - 0.5 : brute; 
        }

        function isScheduleInvalid(schedule) {
            const counts = { 'C': 0, 'X': 0, 'Off': 0 };
            schedule.forEach(s => { if(counts[s] !== undefined) counts[s]++; });
            return (counts['C'] !== 4 || counts['X'] !== 1 || counts['Off'] !== 2);
        }

        function loadWeekData() {
            window.currentWeekKey = document.getElementById('weekSelector').value;
            if (!window.allSchedules[window.currentWeekKey]) {
                window.allSchedules[window.currentWeekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.saveMasterData();
            }
            updateDateLabels();
            renderPlanning();
        }

        function renderPlanning() {
            const container = document.getElementById('exportContainer');
            container.innerHTML = "";
            renderWeekTable(window.currentWeekKey, container);
        }

        function renderWeekTable(weekKey, targetElement, isExport = false) {
            const data = window.allSchedules[weekKey] || BASE_TEMPLATE;
            const weekDiv = document.createElement('div');
            weekDiv.className = "week-container bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-8";
            
            // Calcul des dates
            const [year, week] = weekKey.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));

            let tableHtml = `
                <div class="p-3 bg-gray-50 border-b flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400">SEMAINE ${week}</span>
                    <span class="text-xs font-medium text-gray-600">${monday.toLocaleDateString('fr-FR', {day:'numeric', month:'short'})} - ${new Date(monday.getTime() + 6*86400000).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}</span>
                </div>
                <table class="w-full">
                    <thead>
                        <tr class="bg-white border-b">
                            <th class="compact-th w-32 border-r text-left pl-4">TEAM</th>
                            ${['LUN','MAR','MER','JEU','VEN','SAM','DIM'].map((d, i) => {
                                let cur = new Date(monday); cur.setDate(monday.getDate() + i);
                                return `<th class="compact-th border-r text-center">${d}<br><span class="text-[10px] text-gray-400 font-normal">${cur.getDate()}</span></th>`;
                            }).join('')}
                            <th class="compact-th text-center w-16 text-indigo-600">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody>`;

            data.forEach((emp, empIdx) => {
                const invalid = isScheduleInvalid(emp.schedule);
                let weeklyTotal = 0;
                tableHtml += `<tr class="border-b ${invalid && !isExport ? 'row-alert' : ''}">
                    <td class="compact-td border-r pl-4 font-semibold text-gray-700 truncate" onclick="editName(${empIdx})">${emp.name}</td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    weeklyTotal += getNetHours(code);
                    tableHtml += `<td class="compact-td border-r p-0 text-center">
                        <select onchange="updateShift('${weekKey}', ${empIdx}, ${dayIdx}, this.value)" class="w-full h-full font-bold ${code ? 'shift-'+code : 'shift-Empty'}">
                            ${Object.keys(SHIFT_HOURS).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                        </select></td>`;
                });
                tableHtml += `<td class="compact-td text-center font-bold text-indigo-500 bg-indigo-50/20">${weeklyTotal}h</td></tr>`;
            });

            tableHtml += `</tbody></table>`;
            weekDiv.innerHTML = tableHtml;
            targetElement.appendChild(weekDiv);
        }

        function updateShift(weekKey, empIdx, dayIdx, value) {
            window.allSchedules[weekKey][empIdx].schedule[dayIdx] = value;
            window.saveMasterData();
        }

        function prepareMonthlyExport() {
            const [year, weekStr] = window.currentWeekKey.split('-W');
            const container = document.getElementById('exportContainer');
            container.innerHTML = `<h1 class="text-2xl font-bold mb-8 no-print">Préparation de l'export mensuel...</h1>`;
            
            // On cherche le mois du premier jour de la semaine actuelle
            let d = new Date(year, 0, 1 + (Number(weekStr) - 1) * 7);
            const targetMonth = d.getMonth();
            const targetYear = d.getFullYear();

            // Parcourir toutes les semaines de l'année pour trouver celles du même mois
            for(let w=1; w<=53; w++) {
                let wk = `${targetYear}-W${String(w).padStart(2, '0')}`;
                let wd = new Date(targetYear, 0, 1 + (w - 1) * 7);
                if(wd.getMonth() === targetMonth && window.allSchedules[wk]) {
                    renderWeekTable(wk, container, true);
                }
            }
            
            setTimeout(() => {
                window.print();
                renderPlanning(); // Revenir à la vue normale après impression
            }, 500);
        }

        function editName(index) {
            const n = prompt("Nom :", window.allSchedules[window.currentWeekKey][index].name);
            if(n) {
                window.allSchedules[window.currentWeekKey][index].name = n;
                window.saveMasterData();
            }
        }

        function addNewEmployee() {
            const n = prompt("Nom :");
            if(n) {
                if(!window.allSchedules[window.currentWeekKey]) window.allSchedules[window.currentWeekKey] = [];
                window.allSchedules[window.currentWeekKey].push({name: n, schedule: ["","","","","","",""]});
                window.saveMasterData();
            }
        }

        function updateDateLabels() {
            const [year, week] = window.currentWeekKey.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));
            document.getElementById('navMonthDisplay').innerText = monday.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            loadWeekData();
        }

        function toggleView(view) {
            document.getElementById('planningView').classList.toggle('hidden', view === 'billing');
            document.getElementById('billingView').classList.toggle('hidden', view === 'planning');
            if(view === 'billing') {
                const tbody = document.getElementById('billingBody');
                tbody.innerHTML = "";
                window.allSchedules[window.currentWeekKey].forEach(emp => {
                    let h = emp.schedule.reduce((acc, c) => acc + getNetHours(c), 0);
                    let mH = (h * 4.33).toFixed(1);
                    tbody.innerHTML += `<tr class="border-b"><td class="p-4 font-bold text-gray-700">${emp.name}</td><td class="p-4 text-center font-medium text-gray-500">${mH}h</td><td class="p-4 text-right font-bold text-green-600">${(mH * 12).toFixed(2)}€</td></tr>`;
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const initialWeek = window.getWeekKey(now);
            window.currentWeekKey = initialWeek;
            document.getElementById('weekSelector').value = initialWeek;
        });
    </script>
</body>
</html>
