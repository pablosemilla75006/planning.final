<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Gestion Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; color: #1a1a1a; font-weight: 300; }
        table { table-layout: fixed; width: 100%; }
        select { appearance: none; -webkit-appearance: none; outline: none; border: none; background: transparent; width: 100%; }
        .shift-cell { width: 80px; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #F7CAC9; color: #721c24; }
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; color: #94a3b8; }
        .font-medium { font-weight: 500; }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-2xl font-semibold tracking-tighter text-gray-900">Pab<span class="text-indigo-600">app</span></h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1 gap-1">
                    <button onclick="changeWeek(-1)" class="p-2 hover:text-indigo-500">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <input type="week" id="weekSelector" onchange="updateDates()" class="bg-transparent text-xs font-medium text-gray-600 outline-none">
                    <button onclick="changeWeek(1)" class="p-2 hover:text-indigo-500">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 18 6-6 6-6"/></svg>
                    </button>
                </div>
                <span id="navMonthDisplay" class="text-sm font-medium text-indigo-500 bg-indigo-50 px-4 py-1.5 rounded-full uppercase tracking-wider text-[10px]"></span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Menu Export -->
            <div class="relative group">
                <button class="text-gray-500 border border-gray-200 hover:bg-gray-50 text-sm font-medium px-4 py-2.5 rounded-full flex items-center gap-2">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Exporter
                </button>
                <div class="absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-xl shadow-lg hidden group-hover:block z-50">
                    <button onclick="exportData('excel-win')" class="w-full text-left px-4 py-3 text-xs hover:bg-gray-50 text-gray-700 border-b border-gray-50">Excel (Windows)</button>
                    <button onclick="exportData('excel-mac')" class="w-full text-left px-4 py-3 text-xs hover:bg-gray-50 text-gray-700 border-b border-gray-50">Excel (Mac)</button>
                    <button onclick="exportData('sheets')" class="w-full text-left px-4 py-3 text-xs hover:bg-gray-50 text-gray-700">Google Sheets</button>
                </div>
            </div>
            
            <button onclick="toggleView('billing')" class="text-gray-500 hover:text-indigo-500 text-sm font-medium px-4 py-2">Bilan Mensuel</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm hover:bg-indigo-700 transition-all">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-8 max-w-[1600px] mx-auto">
        <div class="mb-4 text-lg font-light text-gray-400 italic" id="tableMonthHeader"></div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="text-sm text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="p-5 font-medium text-gray-400 uppercase text-[10px] w-36 border-r">Team</th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Lun</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Mar</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Mer</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Jeu</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Ven</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Sam</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Dim</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="p-4 text-center font-medium text-indigo-500 bg-indigo-50/20 w-28 text-[10px] uppercase">Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot><tr id="totalDailyRow" class="bg-gray-50/30 border-t border-gray-100"></tr></tfoot>
            </table>
        </div>
    </main>

    <!-- VUE BILAN -->
    <main id="billingView" class="hidden p-8 max-w-4xl mx-auto">
        <button onclick="toggleView('planning')" class="text-indigo-500 text-sm font-medium mb-4 flex items-center gap-2">← Retour</button>
        <h2 class="text-3xl font-light text-gray-900 mb-8">Bilan <span class="text-indigo-600 font-medium">Pabapp</span> <span id="billingMonthLabel" class="text-gray-400 italic"></span></h2>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm" style="table-layout: auto;">
                <thead class="bg-gray-50">
                    <tr><th class="p-5 font-medium text-gray-500">Employé</th><th class="p-5 font-medium text-gray-500 text-center">Heures Mensuelles</th><th class="p-5 font-medium text-gray-500 text-center">Coût (12€/h)</th></tr>
                </thead>
                <tbody id="billingBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const rawHours = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        let defaultTeam = [{name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},{name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},{name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},{name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},{name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},{name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]},{name:"Maria",schedule:["Off","Off","C","C","C","C","X"]},{name:"Snow",schedule:["C","C","C","Off","Off","C","X"]},{name:"Selah",schedule:["","C","","C","","",""]},{name:"Andrew",schedule:["Off","Off","C","C","C","C","X"]},{name:"Valentine",schedule:["C","C","C","","","","C"]},{name:"Solal",schedule:["Off","C","C","C","C","X","Off"]},{name:"Artem",schedule:["C","C","C","C","X","Off","Off"]},{name:"Celine",schedule:["Off","Off","C","C","C","C","X"]}];
        
        let team = JSON.parse(localStorage.getItem('pabapp_data')) || defaultTeam;
        function saveData() { localStorage.setItem('pabapp_data', JSON.stringify(team)); }
        function getNetHours(code) { let brute = rawHours[code] || 0; return brute > 6 ? brute - 0.5 : brute; }

        function toggleView(view) {
            document.getElementById('planningView').classList.toggle('hidden', view === 'billing');
            document.getElementById('billingView').classList.toggle('hidden', view === 'planning');
            if(view === 'billing') calculateMonthlyBilling();
        }

        function updateDates() {
            const weekVal = document.getElementById('weekSelector').value;
            const [year, week] = weekVal.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));
            const monthText = monday.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
            
            document.getElementById('navMonthDisplay').innerText = monthText;
            document.getElementById('tableMonthHeader').innerText = "Planning de " + monthText;
            document.getElementById('billingMonthLabel').innerText = monthText;

            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                label.innerText = d.toLocaleDateString('fr-FR', { day: '2-digit' });
            });
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = "";
            let dailyTotals = [0,0,0,0,0,0,0];
            team.forEach((emp, empIdx) => {
                let row = document.createElement('tr'); row.className = "border-b border-gray-50 hover:bg-gray-50/50";
                let weeklyTotal = 0;
                let html = `<td class="p-5 font-medium text-gray-700 border-r truncate text-xs cursor-pointer" onclick="editName(${empIdx})">${emp.name}</td>`;
                emp.schedule.forEach((code, dayIdx) => {
                    const net = getNetHours(code); weeklyTotal += net; dailyTotals[dayIdx] += net;
                    html += `<td class="p-2 text-center border-r border-gray-50/50">
                        <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" class="w-full rounded-lg py-2 text-center font-medium text-[11px] ${code ? 'shift-'+code : 'shift-Empty'}">
                            ${Object.keys(rawHours).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                        </select></td>`;
                });
                html += `<td class="p-5 text-center font-medium text-indigo-500 bg-indigo-50/10">${weeklyTotal}h</td>`;
                row.innerHTML = html; tbody.appendChild(row);
            });
            renderDailyTotals(dailyTotals);
        }

        function calculateMonthlyBilling() {
            const tbody = document.getElementById('billingBody'); tbody.innerHTML = "";
            team.forEach(emp => {
                let weekH = emp.schedule.reduce((acc, code) => acc + getNetHours(code), 0);
                let monthH = (weekH * 4.33).toFixed(1);
                tbody.innerHTML += `<tr class="border-b border-gray-100/50"><td class="p-5 font-medium text-gray-700">${emp.name}</td><td class="p-5 text-center text-gray-600">${monthH}h</td><td class="p-5 text-center font-medium text-green-600">${(monthH * 12).toFixed(2)}€</td></tr>`;
            });
        }

        // --- FONCTION EXPORT ---
        function exportData(type) {
            let csvContent = "\uFEFF"; // BOM pour gérer les accents
            const separator = (type === 'excel-win') ? ";" : ","; // Point-virgule pour Excel Windows, virgule pour Mac/Sheets
            
            // En-têtes
            csvContent += `Collaborateur${separator}Lun${separator}Mar${separator}Mer${separator}Jeu${separator}Ven${separator}Sam${separator}Dim${separator}Total Net\n`;
            
            // Données
            team.forEach(emp => {
                let weeklyTotal = emp.schedule.reduce((acc, code) => acc + getNetHours(code), 0);
                let row = [emp.name, ...emp.schedule, weeklyTotal + "h"];
                csvContent += row.join(separator) + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `pabapp_planning_${document.getElementById('navMonthDisplay').innerText}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            updateDates();
        }

        function updateShift(empIdx, dayIdx, value) { team[empIdx].schedule[dayIdx] = value; saveData(); renderPlanning(); }
        function editName(index) { const n = prompt("Nom :", team[index].name); if(n) { team[index].name = n; saveData(); renderPlanning(); }}
        function addNewEmployee() { const n = prompt("Nom :"); if(n) { team.push({name: n, schedule: ["","","","","","",""]}); saveData(); renderPlanning(); }}
        
        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            let html = `<td class="p-5 border-r text-gray-400 text-[9px] font-medium uppercase italic">Heures Jour</td>`;
            totals.forEach(t => { html += `<td class="p-4 text-center text-gray-800 text-base">${t}h</td>`; });
            html += `<td class="bg-indigo-50/10"></td>`;
            footerRow.innerHTML = html;
        }

        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const currentWeek = Math.ceil((((now - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        document.getElementById('weekSelector').value = `${now.getFullYear()}-W${String(currentWeek).padStart(2, '0')}`;
        updateDates();
    </script>
</body>
</html>
