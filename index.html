<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPlanner - Style Skello</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .cell-c { background-color: #dcfce7; color: #166534; } /* Travail - Vert */
        .cell-off { background-color: #fef9c3; color: #854d0e; } /* Repos - Jaune */
        .cell-x { background-color: #fce7f3; color: #9d174d; } /* Spécial - Rose */
    </style>
</head>
<body class="bg-[#f8fafc]">

    <!-- Sidebar & Nav -->
    <nav class="bg-white border-b border-slate-200 p-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-8">
            <h1 class="text-[#0f172a] text-xl font-bold tracking-tight">TeamPlanner <span class="text-indigo-600">Pro</span></h1>
            <div class="flex bg-slate-100 rounded-lg p-1">
                <button class="px-4 py-1.5 bg-white shadow-sm rounded-md text-sm font-medium">Planning Semaine</button>
                <button class="px-4 py-1.5 text-sm text-slate-500 font-medium">Équipe</button>
            </div>
        </div>
        <div class="flex gap-3">
            <button class="text-slate-600 px-4 py-2 text-sm font-semibold italic">Semaine du 20 Avril</button>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-sm transition-all">
                + Nouveau Shift
            </button>
        </div>
    </nav>

    <div class="p-6">
        <!-- Table de Planning -->
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden">
            <table class="w-full border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200">
                        <th class="p-4 font-semibold text-slate-700 text-left w-48 border-r">Collaborateur</th>
                        <th class="p-4 font-semibold text-slate-600">Lundi</th>
                        <th class="p-4 font-semibold text-slate-600">Mardi</th>
                        <th class="p-4 font-semibold text-slate-600">Mercredi</th>
                        <th class="p-4 font-semibold text-slate-600">Jeudi</th>
                        <th class="p-4 font-semibold text-slate-600">Vendredi</th>
                        <th class="p-4 font-semibold text-slate-600">Samedi</th>
                        <th class="p-4 font-semibold text-slate-600">Dimanche</th>
                        <th class="p-4 font-semibold text-indigo-600 border-l bg-indigo-50/30">Total Heures</th>
                    </tr>
                </thead>
                <tbody id="planning-body">
                    <!-- Les données s'afficheront ici -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal d'ajout (Style Skello) -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 hidden backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Ajouter un créneau</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Employé</label>
                    <input type="text" id="nameInput" placeholder="Ex: Pablo" class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Type de Shift</label>
                    <select id="typeInput" class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="C">Travail (C)</option>
                        <option value="Off">Repos (Off)</option>
                        <option value="X">Spécial (X)</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="addShift()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Enregistrer</button>
                    <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const employees = ["Pablo", "Antoine", "Basile", "Eliot", "Florian", "Giulia", "Maria"];
        
        function initTable() {
            const tbody = document.getElementById('planning-body');
            employees.forEach(emp => {
                renderRow(emp);
            });
        }

        function renderRow(name) {
            const tbody = document.getElementById('planning-body');
            const row = document.createElement('tr');
            row.className = "border-b border-slate-100 hover:bg-slate-50/50 transition";
            
            row.innerHTML = `
                <td class="p-4 font-bold text-slate-700 border-r bg-white italic">${name}</td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-c font-bold text-xs">C</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-c font-bold text-xs">C</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-off font-bold text-xs">Off</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-c font-bold text-xs">C</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-x font-bold text-xs">X</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-c font-bold text-xs">C</div></td>
                <td class="p-2 text-center"><div class="rounded-lg p-3 cell-off font-bold text-xs">Off</div></td>
                <td class="p-4 text-center font-bold text-indigo-600 border-l bg-indigo-50/20 text-base">48h</td>
            `;
            tbody.appendChild(row);
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function addShift() {
            const name = document.getElementById('nameInput').value;
            if(name) {
                renderRow(name);
                closeModal();
            }
        }

        initTable();
    </script>
</body>
</html>
