<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Cloud Sync Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ==========================================
        // COLLE TES INFOS FIREBASE CI-DESSOUS
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyDBYfbe7TqTc9geIWjUeNTsxeXXytaHoMk",
  authDomain: "pabapp-d9067.firebaseapp.com",
  databaseURL: "https://pabapp-d9067-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "pabapp-d9067",
  storageBucket: "pabapp-d9067.firebasestorage.app",
  messagingSenderId: "311970041106",
  appId: "1:311970041106:web:c6be2a818ff4a0eb7277cb",
  measurementId: "G-GKGSX0YSNH"
};
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'planning');

        window.allSchedules = {};
        window.currentWeekKey = "";

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.allSchedules = data;
                renderPlanning();
            } else {
                saveMasterData(true); 
            }
        });

        window.saveMasterData = function(isInit = false) {
            if(isInit && Object.keys(window.allSchedules).length === 0) {
                const now = new Date();
                const weekKey = getWeekKey(now);
                window.allSchedules[weekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
            }
            set(dbRef, window.allSchedules);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; color: #1a1a1a; font-weight: 300; }
        table { table-layout: fixed; width: 100%; }
        select { appearance: none; -webkit-appearance: none; outline: none; border: none; background: transparent; width: 100%; text-align-last: center; cursor: pointer; }
        .shift-cell { width: 80px; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #F7CAC9; color: #721c24; }
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; color: #94a3b8; }
        
        /* Alerte par transparence (version renforcée) */
        .row-alert {
            background-color: rgba(254, 202, 202, 0.8) !important;
            border-left: 6px solid #dc2626;
        }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-2xl font-semibold tracking-tighter text-gray-900">Pab<span class="text-indigo-600">app</span> <span class="text-[9px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full ml-2 align-middle font-bold tracking-widest">LIVE</span></h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1 gap-1">
                    <button onclick="changeWeek(-1)" class="p-2 hover:text-indigo-500">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <input type="week" id="weekSelector" onchange="loadWeekData()" class="bg-transparent text-xs font-medium text-gray-600 outline-none">
                    <button onclick="changeWeek(1)" class="p-2 hover:text-indigo-500">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 18 6-6 6-6"/></svg>
                    </button>
                </div>
                <span id="navMonthDisplay" class="text-sm font-medium text-indigo-500 bg-indigo-50 px-4 py-1.5 rounded-full uppercase tracking-wider text-[10px]"></span>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleView('billing')" class="text-gray-500 hover:text-indigo-500 text-sm font-medium px-4 py-2">Bilan Mensuel</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm hover:bg-indigo-700 transition-all">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-8 max-w-[1600px] mx-auto">
        <div class="mb-4 text-lg font-light text-gray-400 italic" id="tableMonthHeader"></div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="text-sm text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="p-5 font-medium text-gray-400 uppercase text-[10px] w-36 border-r">Team</th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Lun</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Mar</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Mer</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Jeu</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Ven</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Sam</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 uppercase">Dim</span><span class="day-date text-gray-900 text-lg"></span></th>
                        <th class="p-4 text-center font-medium text-indigo-500 bg-indigo-50/20 w-28 text-[10px] uppercase">Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot><tr id="totalDailyRow" class="bg-gray-50/30 border-t border-gray-100"></tr></tfoot>
            </table>
        </div>
    </main>

    <main id="billingView" class="hidden p-8 max-w-4xl mx-auto">
        <button onclick="toggleView('planning')" class="text-indigo-500 text-sm font-medium mb-4 flex items-center gap-2">← Retour</button>
        <h2 class="text-3xl font-light text-gray-900 mb-8">Bilan Mensuel</h2>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50">
                    <tr><th class="p-5 font-medium text-gray-500">Employé</th><th class="p-5 font-medium text-gray-500 text-center">Heures Mensuelles</th><th class="p-5 font-medium text-gray-500 text-center">Coût (12€/h)</th></tr>
                </thead>
                <tbody id="billingBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SHIFT_HOURS = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        const BASE_TEMPLATE = [
            {name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},
            {name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},
            {name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},
            {name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},
            {name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]},
            {name:"Maria",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Snow",schedule:["C","C","C","Off","Off","C","X"]},
            {name:"Selah",schedule:["","C","","C","","",""]},
            {name:"Andrew",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Valentine",schedule:["C","C","C","","","","C"]},
            {name:"Solal",schedule:["Off","C","C","C","C","X","Off"]},
            {name:"Artem",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Celine",schedule:["Off","Off","C","C","C","C","X"]}
        ];

        function getNetHours(code) { 
            let brute = SHIFT_HOURS[code] || 0; 
            return brute > 6 ? brute - 0.5 : brute; 
        }

        function isScheduleInvalid(schedule) {
            const counts = { 'C': 0, 'X': 0, 'Off': 0 };
            schedule.forEach(s => { if(counts[s] !== undefined) counts[s]++; });
            return (counts['C'] !== 4 || counts['X'] !== 1 || counts['Off'] !== 2);
        }

        function loadWeekData() {
            window.currentWeekKey = document.getElementById('weekSelector').value;
            if (!window.allSchedules[window.currentWeekKey]) {
                window.allSchedules[window.currentWeekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.saveMasterData();
            }
            updateDateLabels();
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            if(!tbody || !window.allSchedules[window.currentWeekKey]) return;
            tbody.innerHTML = "";
            let dailyTotals = [0,0,0,0,0,0,0];
            
            window.allSchedules[window.currentWeekKey].forEach((emp, empIdx) => {
                const invalid = isScheduleInvalid(emp.schedule);
                let row = document.createElement('tr');
                row.className = `border-b border-gray-50 hover:bg-gray-100/50 transition-colors ${invalid ? 'row-alert' : ''}`;
                
                let weeklyTotal = 0;
                let html = `<td class="p-5 font-medium text-gray-700 border-r truncate text-xs"><span class="cursor-pointer" onclick="editName(${empIdx})">${emp.name}</span></td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    const net = getNetHours(code);
                    weeklyTotal += net;
                    dailyTotals[dayIdx] += net;
                    html += `<td class="p-2 text-center border-r border-gray-50/50">
                        <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" class="w-full rounded-lg py-2 text-center font-medium text-[11px] ${code ? 'shift-'+code : 'shift-Empty'}">
                            ${Object.keys(SHIFT_HOURS).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                        </select></td>`;
                });
                html += `<td class="p-5 text-center font-medium text-indigo-500 bg-indigo-50/10">${weeklyTotal}h</td>`;
                row.innerHTML = html;
                tbody.appendChild(row);
            });
            renderDailyTotals(dailyTotals);
        }

        function updateShift(empIdx, dayIdx, value) {
            window.allSchedules[window.currentWeekKey][empIdx].schedule[dayIdx] = value;
            window.saveMasterData();
        }

        function editName(index) {
            const n = prompt("Nom :", window.allSchedules[window.currentWeekKey][index].name);
            if(n) {
                window.allSchedules[window.currentWeekKey][index].name = n;
                window.saveMasterData();
            }
        }

        function addNewEmployee() {
            const n = prompt("Nom :");
            if(n) {
                window.allSchedules[window.currentWeekKey].push({name: n, schedule: ["","","","","","",""]});
                window.saveMasterData();
            }
        }

        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            let html = `<td class="p-5 border-r text-gray-400 text-[9px] font-medium uppercase italic">Heures Jour</td>`;
            totals.forEach(t => { html += `<td class="p-4 text-center text-gray-800 text-base">${t}h</td>`; });
            html += `<td class="bg-indigo-50/10"></td>`;
            footerRow.innerHTML = html;
        }

        function updateDateLabels() {
            const [year, week] = window.currentWeekKey.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));
            const monthText = monday.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
            document.getElementById('navMonthDisplay').innerText = monthText;
            document.getElementById('tableMonthHeader').innerText = "Planning de " + monthText;
            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                label.innerText = d.toLocaleDateString('fr-FR', { day: '2-digit' });
            });
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            loadWeekData();
        }

        function toggleView(view) {
            document.getElementById('planningView').classList.toggle('hidden', view === 'billing');
            document.getElementById('billingView').classList.toggle('hidden', view === 'planning');
            if(view === 'billing') {
                const tbody = document.getElementById('billingBody');
                tbody.innerHTML = "";
                window.allSchedules[window.currentWeekKey].forEach(emp => {
                    let h = emp.schedule.reduce((acc, c) => acc + getNetHours(c), 0);
                    let mH = (h * 4.33).toFixed(1);
                    tbody.innerHTML += `<tr class="border-b border-gray-100"><td class="p-5 font-medium text-gray-700">${emp.name}</td><td class="p-5 text-center text-gray-600">${mH}h</td><td class="p-5 text-center font-medium text-green-600">${(mH * 12).toFixed(2)}€</td></tr>`;
                });
            }
        }

        function getWeekKey(d) {
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            const num = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
            return `${date.getFullYear()}-W${String(num).padStart(2, '0')}`;
        }

        // Init
        const now = new Date();
        document.getElementById('weekSelector').value = getWeekKey(now);
        window.currentWeekKey = getWeekKey(now);
        updateDateLabels();
    </script>
</body>
</html>
