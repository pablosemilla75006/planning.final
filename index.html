<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- SDK FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIGURATION À REMPLACER PAR TES INFOS FIREBASE
        const firebaseConfig = {
            apiKey: "XXXX",
            authDomain: "XXXX.firebaseapp.com",
            databaseURL: "https://XXXX.europe-west1.firebasedatabase.app",
            projectId: "XXXX",
            storageBucket: "XXXX.appspot.com",
            messagingSenderId: "XXXX",
            appId: "XXXX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'planning');

        // Initialisation des variables globales
        window.allSchedules = {};
        window.currentWeekKey = "";

        // ÉCOUTE DES CHANGEMENTS EN TEMPS RÉEL
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.allSchedules = data;
                renderPlanning(); // Se rafraîchit tout seul chez tout le monde !
            } else {
                // Si la base est vide, on initialise avec le template
                saveMasterData(true); 
            }
        });

        // Fonction pour sauvegarder sur le Cloud
        window.saveMasterData = function(isInit = false) {
            if(isInit && Object.keys(window.allSchedules).length === 0) {
                // Premier lancement : on utilise le template
                const now = new Date();
                const weekKey = getWeekKey(now);
                window.allSchedules[weekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
            }
            set(dbRef, window.allSchedules);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; }
        .shift-cell { width: 80px; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #F7CAC9; color: #721c24; }
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; color: #94a3b8; }
        .row-alert { background-color: rgba(254, 202, 202, 0.8) !important; border-left: 6px solid #dc2626; }
        select { appearance: none; outline: none; border: none; background: transparent; width: 100%; text-align-last: center; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-2xl font-semibold tracking-tighter text-gray-900">Pab<span class="text-indigo-600">app</span> <span class="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full ml-2">LIVE</span></h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1">
                    <button onclick="changeWeek(-1)" class="p-2 hover:text-indigo-500">◀</button>
                    <input type="week" id="weekSelector" onchange="loadWeekData()" class="bg-transparent text-xs font-medium outline-none">
                    <button onclick="changeWeek(1)" class="p-2 hover:text-indigo-500">▶</button>
                </div>
                <span id="navMonthDisplay" class="text-sm font-medium text-indigo-500 bg-indigo-50 px-4 py-1.5 rounded-full uppercase text-[10px]"></span>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="toggleView('billing')" class="text-gray-500 text-sm font-medium">Bilan Mensuel</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-8 max-w-[1600px] mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="text-sm text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="p-5 w-36 border-r text-[10px] uppercase text-gray-400">Team</th>
                        <th class="shift-cell p-4 text-center border-r">LUN<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">MAR<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">MER<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">JEU<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">VEN<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">SAM<span class="day-date block text-lg text-black"></span></th>
                        <th class="shift-cell p-4 text-center border-r">DIM<span class="day-date block text-lg text-black"></span></th>
                        <th class="p-4 text-center text-indigo-500 bg-indigo-50/20 text-[10px] uppercase">Total</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const SHIFT_HOURS = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        const BASE_TEMPLATE = [
            {name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},
            {name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},
            {name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},
            {name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},
            {name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]},
            {name:"Maria",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Snow",schedule:["C","C","C","Off","Off","C","X"]},
            {name:"Selah",schedule:["","C","","C","","",""]},
            {name:"Andrew",schedule:["Off","Off","C","C","C","C","X"]},
            {name:"Valentine",schedule:["C","C","C","","","","C"]},
            {name:"Solal",schedule:["Off","C","C","C","C","X","Off"]},
            {name:"Artem",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Celine",schedule:["Off","Off","C","C","C","C","X"]}
        ];

        function getNetHours(code) { 
            let brute = SHIFT_HOURS[code] || 0; 
            return brute > 6 ? brute - 0.5 : brute; 
        }

        function isScheduleInvalid(schedule) {
            const counts = { 'C': 0, 'X': 0, 'Off': 0 };
            schedule.forEach(s => { if(counts[s] !== undefined) counts[s]++; });
            return (counts['C'] !== 4 || counts['X'] !== 1 || counts['Off'] !== 2);
        }

        function loadWeekData() {
            window.currentWeekKey = document.getElementById('weekSelector').value;
            if (!window.allSchedules[window.currentWeekKey]) {
                window.allSchedules[window.currentWeekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.saveMasterData();
            }
            updateDateLabels();
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            if(!tbody || !window.allSchedules[window.currentWeekKey]) return;
            tbody.innerHTML = "";
            
            window.allSchedules[window.currentWeekKey].forEach((emp, empIdx) => {
                const invalid = isScheduleInvalid(emp.schedule);
                let weeklyTotal = 0;
                let row = document.createElement('tr');
                row.className = `border-b border-gray-50 ${invalid ? 'row-alert' : ''}`;
                
                let html = `<td class="p-5 font-medium border-r text-xs">${emp.name}</td>`;
                emp.schedule.forEach((code, dayIdx) => {
                    weeklyTotal += getNetHours(code);
                    html += `<td class="p-2 border-r">
                        <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" class="rounded-lg py-2 ${code ? 'shift-'+code : 'shift-Empty'}">
                            ${Object.keys(SHIFT_HOURS).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                        </select></td>`;
                });
                html += `<td class="p-5 text-center font-medium text-indigo-500">${weeklyTotal}h</td>`;
                row.innerHTML = html;
                tbody.appendChild(row);
            });
        }

        function updateShift(empIdx, dayIdx, value) {
            window.allSchedules[window.currentWeekKey][empIdx].schedule[dayIdx] = value;
            window.saveMasterData(); // Envoie directement au Cloud
        }

        function updateDateLabels() {
            const [year, week] = window.currentWeekKey.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const monday = new Date(date.setDate(date.getDate() - date.getDay() + 1));
            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday); d.setDate(monday.getDate() + i);
                label.innerText = d.getDate();
            });
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            loadWeekData();
        }

        function getWeekKey(d) {
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            const num = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
            return `${date.getFullYear()}-W${String(num).padStart(2, '0')}`;
        }

        // Init date
        const initSelector = () => {
            const now = new Date();
            document.getElementById('weekSelector').value = getWeekKey(now);
            window.currentWeekKey = getWeekKey(now);
            updateDateLabels();
        };
        initSelector();

    </script>
</body>
</html>
