<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Export Calendaire Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBYfbe7TqTc9geIWjUeNTsxeXXytaHoMk",
            authDomain: "pabapp-d9067.firebaseapp.com",
            databaseURL: "https://pabapp-d9067-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pabapp-d9067",
            storageBucket: "pabapp-d9067.firebasestorage.app",
            messagingSenderId: "311970041106",
            appId: "1:311970041106:web:c6be2a818ff4a0eb7277cb",
            measurementId: "G-GKGSX0YSNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'planning');

        window.allSchedules = {};
        window.currentWeekKey = "";

        window.getWeekKey = (d) => {
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            return `${date.getFullYear()}-W${String(1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7)).padStart(2, '0')}`;
        };

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.allSchedules = data;
                if (!window.currentWeekKey) {
                    window.currentWeekKey = window.getWeekKey(new Date());
                    document.getElementById('weekSelector').value = window.currentWeekKey;
                    updateDateLabels();
                }
                renderPlanning();
            } else {
                saveMasterData(true);
            }
        });

        window.saveMasterData = (isInit = false) => {
            if(isInit && (!window.allSchedules || Object.keys(window.allSchedules).length === 0)) {
                window.allSchedules[window.getWeekKey(new Date())] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
            }
            set(dbRef, window.allSchedules);
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #4A6762; color: #ffffff; } 
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; }
        
        /* Styles Exportation PDF (Strict Sheet) */
        @media print {
            nav, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            #exportArea { display: block !important; }
            #planningView { display: none !important; }
            table { border: 1px solid black !important; width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid black !important; font-size: 8px !important; padding: 2px !important; text-align: center; }
            .name-col { text-align: left !important; font-weight: bold; width: 80px; }
            .month-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
        }
        #exportArea { display: none; }
    </style>
</head>
<body>

    <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50 no-print">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-bold tracking-tighter">Pab<span class="text-indigo-600">app</span></h1>
            <div class="flex items-center bg-gray-100 rounded-full px-3 py-1 gap-2">
                <button onclick="changeWeek(-1)" class="text-xs">◀</button>
                <input type="week" id="weekSelector" onchange="loadWeekData()" class="bg-transparent text-xs font-bold outline-none">
                <button onclick="changeWeek(1)" class="text-xs">▶</button>
            </div>
            <span id="navMonthDisplay" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full uppercase"></span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="generateMonthlyPDF()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-full text-xs font-bold hover:bg-indigo-700 transition-all shadow-sm">Exporter le Mois</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-xs hover:bg-black">+ Nouveau</button>
        </div>
    </nav>

    <main id="planningView" class="p-8 max-w-[1600px] mx-auto no-print">
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b">
                        <th class="p-6 text-[10px] uppercase tracking-widest border-r w-40 text-gray-400">Team</th>
                        ${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d => `<th class="p-4 text-center border-r w-24 text-[10px] uppercase text-gray-400">${d}</th>`).join('')}
                        <th class="p-4 text-center w-28 text-indigo-600 font-bold text-[10px]">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="exportArea" class="p-4"></div>

    <script>
        const SHIFT_HOURS = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        const BASE_TEMPLATE = [
            {name:"Pablo",schedule:["Off","C","C","X","X","C","Off"]},{name:"Antoine",schedule:["C","C","C","Off","Off","X","C"]},
            {name:"Basile",schedule:["C","Off","Off","C","C","C","X"]},{name:"Eliot",schedule:["C","C","C","C","X","Off","Off"]},
            {name:"Florian",schedule:["C","C","Off","Off","C","C","X"]},{name:"Giulia",schedule:["Off","Off","C","C","C","X","C"]}
        ];

        function getNetHours(code) { let b = SHIFT_HOURS[code] || 0; return b > 6 ? b - 0.5 : b; }

        function loadWeekData() {
            window.currentWeekKey = document.getElementById('weekSelector').value;
            if (!window.allSchedules[window.currentWeekKey]) {
                window.allSchedules[window.currentWeekKey] = JSON.parse(JSON.stringify(BASE_TEMPLATE));
                window.saveMasterData();
            }
            updateDateLabels();
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            const data = window.allSchedules[window.currentWeekKey] || [];
            data.forEach((emp, empIdx) => {
                let total = 0;
                let html = `<tr class="border-b"><td class="p-5 font-bold border-r text-xs uppercase text-gray-700">${emp.name}</td>`;
                emp.schedule.forEach((code, dayIdx) => {
                    total += getNetHours(code);
                    html += `<td class="p-2 border-r text-center">
                        <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" class="w-full py-2 rounded-lg font-bold text-[11px] ${code ? 'shift-'+code : 'shift-Empty'}">
                            ${Object.keys(SHIFT_HOURS).map(o => `<option value="${o}" ${o===code?'selected':''}>${o||'-'}</option>`).join('')}
                        </select></td>`;
                });
                html += `<td class="p-5 text-center font-bold text-indigo-600 bg-indigo-50/20">${total}h</td></tr>`;
                tbody.innerHTML += html;
            });
        }

        function updateShift(empIdx, dayIdx, val) {
            window.allSchedules[window.currentWeekKey][empIdx].schedule[dayIdx] = val;
            window.saveMasterData();
        }

        function generateMonthlyPDF() {
            const [year, weekStr] = window.currentWeekKey.split('-W');
            const dateRef = new Date(year, 0, 1 + (Number(weekStr) - 1) * 7);
            const month = dateRef.getMonth();
            const monthName = dateRef.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
            
            const firstDay = new Date(dateRef.getFullYear(), month, 1);
            const lastDay = new Date(dateRef.getFullYear(), month + 1, 0);
            
            let html = `<div class="month-title">Planning : ${monthName}</div>`;
            html += `<table><thead><tr><th class="name-col">Employé</th>`;
            
            for(let d=1; d<=lastDay.getDate(); d++) {
                const cur = new Date(dateRef.getFullYear(), month, d);
                const dayLabel = cur.toLocaleDateString('fr-FR', {weekday: 'short'}).toUpperCase().substring(0,2);
                html += `<th>${dayLabel}<br>${d}</th>`;
            }
            html += `<th>TOTAL</th></tr></thead><tbody>`;

            const employees = window.allSchedules[window.currentWeekKey].map(e => e.name);
            employees.forEach(name => {
                html += `<tr><td class="name-col">${name}</td>`;
                let rowTotal = 0;
                for(let d=1; d<=lastDay.getDate(); d++) {
                    const curDate = new Date(dateRef.getFullYear(), month, d);
                    const wk = window.getWeekKey(curDate);
                    const dayIdx = (curDate.getDay() + 6) % 7;
                    const shift = (window.allSchedules[wk] && window.allSchedules[wk].find(e => e.name === name)) 
                                  ? window.allSchedules[wk].find(e => e.name === name).schedule[dayIdx] : "";
                    rowTotal += getNetHours(shift);
                    html += `<td>${shift || '-'}</td>`;
                }
                html += `<td style="font-weight:bold">${rowTotal}h</td></tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('exportArea').innerHTML = html;
            window.print();
        }

        function updateDateLabels() {
            const [y, w] = window.currentWeekKey.split('-W');
            const d = new Date(y, 0, 1 + (w - 1) * 7);
            const mon = new Date(d.setDate(d.getDate() - d.getDay() + 1));
            document.getElementById('navMonthDisplay').innerText = mon.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
        }

        function changeWeek(s) {
            const sel = document.getElementById('weekSelector');
            const [y, w] = sel.value.split('-W').map(Number);
            const d = new Date(y, 0, 1 + (w - 1) * 7);
            d.setDate(d.getDate() + (s * 7));
            sel.value = window.getWeekKey(d);
            loadWeekData();
        }

        function addNewEmployee() {
            const n = prompt("Nom :");
            if(n) {
                window.allSchedules[window.currentWeekKey].push({name: n, schedule: ["","","","","","",""]});
                window.saveMasterData();
            }
        }
    </script>
</body>
</html>
