<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPlanner Pro - Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importation de polices modernes -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Geist', 'Inter', sans-serif; 
            background-color: #f8fafc; 
            letter-spacing: -0.01em;
        }
        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #F7CAC9; color: #721c24; }
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #cbd5e1; color: #94a3b8; }
        
        /* Style pour les boutons de navigation */
        .nav-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover {
            background-color: #f1f5f9;
            transform: translateY(-1px);
        }
        .nav-btn:active {
            transform: translateY(0px);
        }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-slate-200 p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-8">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Team<span class="text-indigo-600">Planner</span></h1>
            
            <!-- Navigation Semaine -->
            <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl p-1 gap-1">
                <button onclick="changeWeek(-1)" class="nav-btn p-2 rounded-lg text-slate-600 hover:text-indigo-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                
                <input type="week" id="weekSelector" onchange="updateDates()" class="bg-transparent font-bold text-sm text-slate-700 outline-none px-2 cursor-pointer" value="2026-W18">
                
                <button onclick="changeWeek(1)" class="nav-btn p-2 rounded-lg text-slate-600 hover:text-indigo-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:block text-right">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Statut</span>
                <span class="text-xs font-semibold text-green-600 flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Mode Édition
                </span>
            </div>
            <button onclick="addNewEmployee()" class="bg-slate-900 hover:bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-100 transition-all">
                + Collaborateur
            </button>
        </div>
    </nav>

    <div class="p-6 max-w-[1600px] mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl shadow-slate-200/60 border border-slate-200 overflow-hidden">
            <table class="w-full text-sm text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/50 border-b border-slate-200">
                        <th class="p-5 font-bold border-r w-52 text-slate-900 text-base">Équipe</th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Lun</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Mar</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Mer</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Jeu</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Ven</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Sam</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center border-r"><span class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Dim</span><span class="day-date text-slate-700 font-black"></span></th>
                        <th class="p-4 text-center font-bold text-indigo-600 bg-indigo-50/30 w-32">Total Net</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr id="totalDailyRow" class="bg-slate-50/80 font-bold border-t-2 border-slate-200">
                        <td class="p-5 border-r text-slate-500 font-bold text-xs uppercase">Heures effectives jour</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="mt-8 flex gap-4 overflow-x-auto pb-4">
            <div class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-full shadow-sm text-[11px] font-bold">
                <span class="w-3 h-3 rounded-full shift-X"></span> Coupure (12h)
            </div>
            <div class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-full shadow-sm text-[11px] font-bold">
                <span class="w-3 h-3 rounded-full shift-C"></span> Continue (9.5h)
            </div>
            <div class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-full shadow-sm text-[11px] font-bold">
                <span class="w-3 h-3 rounded-full shift-PC"></span> Petite (4h)
            </div>
        </div>
    </div>

    <script>
        const rawHours = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        
        let team = [
            { name: "Pablo", schedule: ["Off", "C", "C", "X", "X", "C", "Off"] },
            { name: "Antoine", schedule: ["C", "C", "C", "Off", "Off", "X", "C"] },
            { name: "Basile", schedule: ["C", "Off", "Off", "C", "C", "C", "X"] },
            { name: "Eliot", schedule: ["C", "C", "C", "C", "X", "Off", "Off"] },
            { name: "Florian", schedule: ["C", "C", "Off", "Off", "C", "C", "X"] },
            { name: "Giulia", schedule: ["Off", "Off", "C", "C", "C", "X", "C"] },
            { name: "Maria", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] },
            { name: "Snow", schedule: ["C", "C", "C", "Off", "Off", "C", "X"] },
            { name: "Selah", schedule: ["", "C", "", "C", "", "", ""] },
            { name: "Andrew", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] },
            { name: "Valentine", schedule: ["C", "C", "C", "", "", "", "C"] },
            { name: "Solal", schedule: ["Off", "C", "C", "C", "C", "X", "Off"] },
            { name: "Artem", schedule: ["C", "C", "C", "C", "X", "Off", "Off"] },
            { name: "Celine", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] }
        ];

        function getNetHours(code) {
            let brute = rawHours[code] || 0;
            return brute > 6 ? brute - 0.5 : brute;
        }

        // --- NAVIGATION SEMAINE ---
        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            
            // Calculer la nouvelle année et semaine
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil(( ( (newDate - new Date(newYear, 0, 1)) / 8.64e7) + 1) / 7);
            
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            updateDates();
        }

        function updateDates() {
            const weekVal = document.getElementById('weekSelector').value;
            const [year, week] = weekVal.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const day = date.getDay();
            const diff = date.getDate() - day + (day == 0 ? -6:1);
            const monday = new Date(date.setDate(diff));

            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                label.innerText = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
            });
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            let dailyTotals = [0, 0, 0, 0, 0, 0, 0];

            team.forEach((emp, empIdx) => {
                let row = document.createElement('tr');
                row.className = "group border-b border-slate-100 hover:bg-slate-50 transition-colors";
                
                let weeklyTotal = 0;
                let html = `<td class="p-5 font-bold text-slate-700 border-r bg-white group-hover:bg-slate-50 transition-colors cursor-pointer" onclick="editName(${empIdx})">${emp.name}</td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    const net = getNetHours(code);
                    weeklyTotal += net;
                    dailyTotals[dayIdx] += net;
                    
                    html += `
                        <td class="p-2 text-center border-r border-slate-50">
                            <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" 
                                    class="w-full rounded-xl py-2.5 px-1 text-center font-black text-[11px] cursor-pointer shadow-sm transition-all ${code ? 'shift-'+code : 'shift-Empty hover:border-indigo-300'}">
                                ${Object.keys(rawHours).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                            </select>
                        </td>`;
                });

                html += `<td class="p-5 text-center font-black text-indigo-600 bg-indigo-50/30 text-base italic">${weeklyTotal}h</td>`;
                row.innerHTML = html;
                tbody.appendChild(row);
            });
            renderDailyTotals(dailyTotals);
        }

        function updateShift(empIdx, dayIdx, value) {
            team[empIdx].schedule[dayIdx] = value;
            renderPlanning();
        }

        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            let html = `<td class="p-5 border-r text-slate-400 font-bold text-[10px] uppercase tracking-wider">Total Heures Jour</td>`;
            totals.forEach(t => { html += `<td class="p-4 text-center text-slate-900 font-black text-base">${t}h</td>`; });
            html += `<td class="bg-indigo-100/20 border-l border-indigo-100"></td>`;
            footerRow.innerHTML = html;
        }

        function editName(index) {
            const n = prompt("Nom du collaborateur :", team[index].name);
            if(n) { team[index].name = n; renderPlanning(); }
        }

        function addNewEmployee() {
            const n = prompt("Nouveau nom :");
            if(n) { team.push({name: n, schedule: ["","","","","","",""]}); renderPlanning(); }
        }

        updateDates();
    </script>
</body>
</html>
