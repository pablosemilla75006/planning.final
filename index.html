<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPlanner Pro - Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .shift-X { background-color: #E3A857; color: white; } /* Indian Yellow */
        .shift-C { background-color: #C1E1C1; color: #1e4620; } /* Vert Pastel */
        .shift-PC { background-color: #F7CAC9; color: #721c24; } /* Rouge/Rose Pastel */
        .shift-AM { background-color: #AEC6CF; color: #002366; } /* Bleu Pastel */
        .shift-Off { background-color: #F8C3CD; color: #702963; } /* Rose Pastel */
        .shift-ABS { background-color: #D3D3D3; color: #333333; } /* Gris Pastel */
        .shift-Empty { background-color: #f1f5f9; color: #94a3b8; }
        .editable:hover { cursor: pointer; filter: brightness(0.9); }
    </style>
</head>
<body>

    <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-slate-800">TeamPlanner <span class="text-indigo-600">Pro</span></h1>
            <input type="week" id="weekSelector" class="border rounded-lg px-2 py-1 text-sm text-slate-600" value="2026-W17">
        </div>
        <button onclick="addNewEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition">
            + Ajouter un employé
        </button>
    </nav>

    <div class="p-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead>
                    <tr class="bg-slate-50 border-b">
                        <th class="p-4 font-bold border-r w-48 text-slate-700">Collaborateur</th>
                        <th class="p-4 text-center font-semibold">Lun</th>
                        <th class="p-4 text-center font-semibold">Mar</th>
                        <th class="p-4 text-center font-semibold">Mer</th>
                        <th class="p-4 text-center font-semibold">Jeu</th>
                        <th class="p-4 text-center font-semibold">Ven</th>
                        <th class="p-4 text-center font-semibold">Sam</th>
                        <th class="p-4 text-center font-semibold">Dim</th>
                        <th class="p-4 text-center font-bold text-indigo-600 bg-indigo-50/30">Total Hebdo</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Généré par JS -->
                </tbody>
                <tfoot>
                    <tr id="totalDailyRow" class="bg-slate-50 font-bold border-t-2 border-slate-200">
                        <td class="p-4 border-r">Total Heures Jour</td>
                        <!-- Totaux journaliers injectés ici -->
                    </tr>
                </tfoot>
            </table>
        </div>
        
        <div class="mt-4 p-4 bg-slate-100 rounded-lg text-xs text-slate-500">
            <strong>Légende :</strong> X (Coupure 12.5h) | C (Continue 10h) | PC (Petite C. 4h) | AM (Maladie) | Off (Repos) | ABS (Absence)
        </div>
    </div>

    <script>
        // Configuration des heures par code
        const hourMapping = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        
        // Données initiales
        let team = [
            { name: "Pablo", schedule: ["C", "C", "C", "X", "X", "C", "Off"] },
            { name: "Antoine", schedule: ["C", "C", "C", "Off", "Off", "X", "C"] }
        ];

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            let dailyTotals = [0, 0, 0, 0, 0, 0, 0];

            team.forEach((emp, empIdx) => {
                let row = document.createElement('tr');
                row.className = "border-b border-slate-100";
                
                let weeklyTotal = 0;
                let cellsHtml = `<td class="p-4 font-bold text-slate-700 border-r editable" onclick="editName(${empIdx})">${emp.name}</td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    const hours = hourMapping[code] || 0;
                    weeklyTotal += hours;
                    dailyTotals[dayIdx] += hours;
                    
                    const shiftClass = code ? `shift-${code}` : 'shift-Empty';
                    cellsHtml += `
                        <td class="p-2 text-center">
                            <div onclick="editShift(${empIdx}, ${dayIdx})" 
                                 class="editable rounded-lg py-2 font-bold text-xs transition shadow-sm ${shiftClass}">
                                 ${code || '-'}
                            </div>
                        </td>`;
                });

                cellsHtml += `<td class="p-4 text-center font-bold text-indigo-600 bg-indigo-50/20">${weeklyTotal}h</td>`;
                row.innerHTML = cellsHtml;
                tbody.appendChild(row);
            });

            renderDailyTotals(dailyTotals);
        }

        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            // On garde la première cellule et on ajoute les totaux
            let html = `<td class="p-4 border-r">Total Heures Jour</td>`;
            totals.forEach(t => {
                html += `<td class="p-4 text-center text-slate-600">${t}h</td>`;
            });
            html += `<td class="bg-indigo-100/50"></td>`;
            footerRow.innerHTML = html;
        }

        // --- FONCTIONS D'ÉDITION ---

        function editName(index) {
            const newName = prompt("Nouveau nom de l'employé :", team[index].name);
            if (newName) {
                team[index].name = newName;
                renderPlanning();
            }
        }

        function editShift(empIdx, dayIdx) {
            const current = team[empIdx].schedule[dayIdx];
            const newShift = prompt("Entrez le code shift (X, C, PC, AM, Off, ABS) :", current).toUpperCase();
            
            if (Object.keys(hourMapping).includes(newShift)) {
                team[empIdx].schedule[dayIdx] = newShift;
                renderPlanning();
            } else {
                alert("Code invalide ! Utilisez : X, C, PC, AM, Off ou ABS");
            }
        }

        function addNewEmployee() {
            const name = prompt("Nom du nouvel employé :");
            if (name) {
                team.push({ name: name, schedule: ["", "", "", "", "", "", ""] });
                renderPlanning();
            }
        }

        // Initialisation
        renderPlanning();
    </script>
</body>
</html>
