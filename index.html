<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabapp - Gestion Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fcfcfd; 
            color: #1a1a1a;
            font-weight: 300; /* Typographie fine par défaut */
        }
        
        /* Fixer la largeur des colonnes pour éviter les sauts */
        table {
            table-layout: fixed;
            width: 100%;
        }

        select { 
            appearance: none; 
            -webkit-appearance: none; 
            outline: none; 
            border: none; 
            background: transparent; 
            width: 100%;
        }

        /* Styles des Shifts - Largeur fixe forcée */
        .shift-cell {
            width: 80px; /* Largeur identique pour tous les jours */
        }

        .shift-X { background-color: #E3A857; color: white; }
        .shift-C { background-color: #C1E1C1; color: #1e4620; }
        .shift-PC { background-color: #F7CAC9; color: #721c24; }
        .shift-AM { background-color: #AEC6CF; color: #002366; }
        .shift-Off { background-color: #F8C3CD; color: #702963; }
        .shift-ABS { background-color: #D3D3D3; color: #333333; }
        .shift-Empty { background-color: #ffffff; border: 1px dashed #e2e8f0; color: #94a3b8; }
        
        .font-medium { font-weight: 500; }
        .font-light-custom { font-weight: 300; }
    </style>
</head>
<body>

    <nav class="bg-white border-b border-gray-100 p-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-2xl font-semibold tracking-tighter text-gray-900">Pab<span class="text-indigo-600">app</span></h1>
            <div class="flex items-center bg-gray-50 border border-gray-100 rounded-full px-2 py-1 gap-1">
                <button onclick="changeWeek(-1)" class="p-2 hover:text-indigo-500 transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <input type="week" id="weekSelector" onchange="updateDates()" class="bg-transparent text-xs font-medium text-gray-600 outline-none cursor-pointer">
                <button onclick="changeWeek(1)" class="p-2 hover:text-indigo-500 transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 18 6-6 6-6"/></svg>
                </button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleView('billing')" id="billingBtn" class="text-gray-500 hover:text-indigo-500 text-sm font-medium px-4 py-2">Bilan Mensuel</button>
            <button onclick="addNewEmployee()" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-light-custom hover:bg-indigo-700 shadow-sm transition-all">+ Nouveau Collaborateur</button>
        </div>
    </nav>

    <!-- VUE PLANNING -->
    <main id="planningView" class="p-8 max-w-[1600px] mx-auto">
        <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 overflow-hidden">
            <table class="text-sm text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/50 border-b border-gray-100">
                        <th class="p-5 font-medium text-gray-400 uppercase text-[10px] tracking-widest border-r w-48">Collaborateur</th>
                        <!-- Les jours ont maintenant une classe shift-cell pour la largeur fixe -->
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Lun</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Mar</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Mer</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Jeu</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Ven</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Sam</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="shift-cell p-4 text-center border-r"><span class="block text-[10px] text-gray-400 font-medium uppercase mb-1">Dim</span><span class="day-date text-gray-900 font-light-custom text-lg"></span></th>
                        <th class="p-4 text-center font-medium text-indigo-500 bg-indigo-50/20 w-28">Total Net</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot>
                    <tr id="totalDailyRow" class="bg-gray-50/30 font-light-custom border-t border-gray-100">
                        <!-- Le pied de page suivra la même structure -->
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>

    <!-- VUE BILAN MENSUEL -->
    <main id="billingView" class="hidden p-8 max-w-4xl mx-auto">
        <button onclick="toggleView('planning')" class="text-indigo-500 text-sm font-medium mb-4 flex items-center gap-2">← Retour au planning</button>
        <h2 class="text-3xl font-light-custom text-gray-900 mb-8">Bilan Pab<span class="text-indigo-600 font-medium">app</span> <span id="monthLabel" class="text-gray-400 italic"></span></h2>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm" style="table-layout: auto;"> <!-- Layout auto ici pour le bilan -->
                <thead class="bg-gray-50">
                    <tr>
                        <th class="p-5 font-medium text-gray-500">Employé</th>
                        <th class="p-5 font-medium text-gray-500 text-center">Heures Mensuelles (Est.)</th>
                        <th class="p-5 font-medium text-gray-500 text-center">Coût Estimé (12€/h)</th>
                    </tr>
                </thead>
                <tbody id="billingBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        const rawHours = { 'X': 12.5, 'C': 10, 'PC': 4, 'AM': 0, 'Off': 0, 'ABS': 0, '': 0 };
        
        let defaultTeam = [
            { name: "Pablo", schedule: ["Off", "C", "C", "X", "X", "C", "Off"] },
            { name: "Antoine", schedule: ["C", "C", "C", "Off", "Off", "X", "C"] },
            { name: "Basile", schedule: ["C", "Off", "Off", "C", "C", "C", "X"] },
            { name: "Eliot", schedule: ["C", "C", "C", "C", "X", "Off", "Off"] },
            { name: "Florian", schedule: ["C", "C", "Off", "Off", "C", "C", "X"] },
            { name: "Giulia", schedule: ["Off", "Off", "C", "C", "C", "X", "C"] },
            { name: "Maria", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] },
            { name: "Snow", schedule: ["C", "C", "C", "Off", "Off", "C", "X"] },
            { name: "Selah", schedule: ["", "C", "", "C", "", "", ""] },
            { name: "Andrew", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] },
            { name: "Valentine", schedule: ["C", "C", "C", "", "", "", "C"] },
            { name: "Solal", schedule: ["Off", "C", "C", "C", "C", "X", "Off"] },
            { name: "Artem", schedule: ["C", "C", "C", "C", "X", "Off", "Off"] },
            { name: "Celine", schedule: ["Off", "Off", "C", "C", "C", "C", "X"] }
        ];

        let team = JSON.parse(localStorage.getItem('pabapp_data')) || defaultTeam;

        function saveData() {
            localStorage.setItem('pabapp_data', JSON.stringify(team));
        }

        function getNetHours(code) {
            let brute = rawHours[code] || 0;
            return brute > 6 ? brute - 0.5 : brute;
        }

        function toggleView(view) {
            document.getElementById('planningView').classList.toggle('hidden', view === 'billing');
            document.getElementById('billingView').classList.toggle('hidden', view === 'planning');
            if(view === 'billing') calculateMonthlyBilling();
        }

        function updateDates() {
            const weekVal = document.getElementById('weekSelector').value;
            const [year, week] = weekVal.split('-W');
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            const day = date.getDay();
            const diff = date.getDate() - day + (day == 0 ? -6:1);
            const monday = new Date(date.setDate(diff));
            
            document.getElementById('monthLabel').innerText = monday.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});

            document.querySelectorAll('.day-date').forEach((label, i) => {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                label.innerText = d.toLocaleDateString('fr-FR', { day: '2-digit' });
            });
            renderPlanning();
        }

        function renderPlanning() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            let dailyTotals = [0, 0, 0, 0, 0, 0, 0];

            team.forEach((emp, empIdx) => {
                let row = document.createElement('tr');
                row.className = "border-b border-gray-50 hover:bg-gray-50/50 transition-colors";
                let weeklyTotal = 0;
                
                let html = `<td class="p-5 font-medium text-gray-700 border-r cursor-pointer truncate" onclick="editName(${empIdx})">${emp.name}</td>`;
                
                emp.schedule.forEach((code, dayIdx) => {
                    const net = getNetHours(code);
                    weeklyTotal += net;
                    dailyTotals[dayIdx] += net;
                    html += `
                        <td class="p-2 text-center border-r border-gray-50/50">
                            <select onchange="updateShift(${empIdx}, ${dayIdx}, this.value)" 
                                    class="w-full rounded-lg py-2.5 text-center font-medium text-[11px] cursor-pointer transition-all ${code ? 'shift-'+code : 'shift-Empty'}">
                                ${Object.keys(rawHours).map(opt => `<option value="${opt}" ${opt === code ? 'selected' : ''}>${opt || '-'}</option>`).join('')}
                            </select>
                        </td>`;
                });
                html += `<td class="p-5 text-center font-medium text-indigo-500 bg-indigo-50/10">${weeklyTotal}h</td>`;
                row.innerHTML = html;
                tbody.appendChild(row);
            });
            renderDailyTotals(dailyTotals);
        }

        function calculateMonthlyBilling() {
            const tbody = document.getElementById('billingBody');
            tbody.innerHTML = "";
            team.forEach(emp => {
                let weekH = emp.schedule.reduce((acc, code) => acc + getNetHours(code), 0);
                let monthH = (weekH * 4.33).toFixed(1);
                tbody.innerHTML += `
                    <tr class="border-b border-gray-100/50">
                        <td class="p-5 font-medium text-gray-700">${emp.name}</td>
                        <td class="p-5 text-center text-gray-600">${monthH}h</td>
                        <td class="p-5 text-center font-medium text-green-600">${(monthH * 12).toFixed(2)}€</td>
                    </tr>`;
            });
        }

        function changeWeek(step) {
            const selector = document.getElementById('weekSelector');
            const [year, week] = selector.value.split('-W').map(Number);
            let date = new Date(year, 0, 1 + (week - 1) * 7);
            date.setDate(date.getDate() + (step * 7));
            const newDate = new Date(date.getTime() + 3 * 24 * 60 * 60 * 1000);
            const newYear = newDate.getFullYear();
            const weekNumber = Math.ceil((((newDate - new Date(newYear, 0, 1)) / 86400000) + 1) / 7);
            selector.value = `${newYear}-W${String(weekNumber).padStart(2, '0')}`;
            updateDates();
        }

        function updateShift(empIdx, dayIdx, value) { 
            team[empIdx].schedule[dayIdx] = value; 
            saveData();
            renderPlanning(); 
        }

        function editName(index) { 
            const n = prompt("Nom :", team[index].name); 
            if(n) { team[index].name = n; saveData(); renderPlanning(); }
        }

        function addNewEmployee() { 
            const n = prompt("Nom :"); 
            if(n) { team.push({name: n, schedule: ["","","","","","",""]}); saveData(); renderPlanning(); }
        }
        
        function renderDailyTotals(totals) {
            const footerRow = document.getElementById('totalDailyRow');
            let html = `<td class="p-5 border-r text-gray-400 text-[9px] font-medium uppercase italic">Heures Jour</td>`;
            totals.forEach(t => { html += `<td class="p-4 text-center text-gray-800 font-light-custom text-base">${t}h</td>`; });
            html += `<td class="bg-indigo-50/10"></td>`;
            footerRow.innerHTML = html;
        }

        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const currentWeek = Math.ceil((((now - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        document.getElementById('weekSelector').value = `${now.getFullYear()}-W${String(currentWeek).padStart(2, '0')}`;
        updateDates();
    </script>
</body>
</html>
